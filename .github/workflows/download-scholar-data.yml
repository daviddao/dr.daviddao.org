name: Download scholar

on:
  schedule:
    - cron: '17 4 * * *'   # daily, off the top of the hour to dodge cron rush
  workflow_dispatch: {}     # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: download-scholar
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Crawl Google Scholar
        run: python scholar-crawler/crawl.py

      - name: Commit data (only if changed)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add citations.txt hindex.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update scholar data"
            git push
          fi
